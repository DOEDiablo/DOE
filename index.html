<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시세표 시즌14</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.3;
      font-size: 18px;
    }

    h1 {
      text-align: center;
      color: #ff4444;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .box {
      background: #1b1b1b;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .title {
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .line {
      margin: 0;
      padding: 0;
    }

    a {
      color: #4da6ff;
      text-decoration: none;
      word-break: break-all;
    }

    .center {
      text-align: center;
    }

    .note {
      color: #bbb;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h1>▼▼▼▼▼ 시세표 시즌14 ▼▼▼▼▼</h1>

<div class="box center">
  <div>
    <a href="https://open.kakao.com/o/sIJnJfui">
      https://open.kakao.com/o/saXUOdwi
    </a>
  </div>
  <div>1:1 채팅방 문의주시면 바로 도움드리겠습니다</div>
</div>

<div id="price-list"></div>

<div class="box center">
  <div class="title">디오이 채팅방</div>
  <div>
    <a href="https://open.kakao.com/o/gtu45m1g">
      https://open.kakao.com/o/gtu45m1g
    </a>
  </div>
</div>

<div class="box center">
  <div class="title">아이템 거래 사이트</div>
  <div>
    <a href="https://itembus.com/">
      https://itembus.com/
    </a>
  </div>
</div>

<script>
const priceText = `

---------------------------------------
▶부적세트
도가니. 삼중의. 주문걸린강철.보이지않는자. 폭풍인도자. 등
모든 부적세트 가격 문의주세요~
---------------------------------------
▶잊힌영혼 (바닥거래)
500개 = 15,000원
1000개 = 28,000원
---------------------------------------
▶골드
1억 = 3,000원
5억 = 12,000원
10억 = 22,000원
20억 = 40,000원
---------------------------------------
▶하급열쇠 소굴
20개 = 4,000원
50개 = 8,000원
100개 = 15,000원
---------------------------------------
▶상급열쇠 소굴
20개 = 5,000원
50개 = 10,000원
100개 = 18,000원
---------------------------------------
▶껍데기
1개 = 3,000원
5개 = 12,000원
10개 = 22,000원
20개 = 42,000원
--------------------------------------
▶웅장한보석
1개 = 4,000원
5개 = 18,000원
10개 = 32,000원
---------------------------------------
▶룬셋(투구/갑옷/장갑/바제/장화/반지/목걸이/한.양손무기)
예: (투구룬세트 - 자3개+쿠에3개+가르3개=1set)
1셋 = 14,000원
3셋 = 38,000원
5셋 = 48,000원
---------------------------------------
▶쿨레 조율된 분광경
5개 = 4,000원
10개 = 6,000원
50개 = 25,000원
100개 = 45,000원
---------------------------------------
▶엔트로피/공격적인/숙련자/다채로운 등등
100개 = 18,000원
300개 = 40,000원
500개 = 65,000원
---------------------------------------
1-70레벨 = 5,000원
1-70레벨+정복자100 = 35,000원
나락100단 1시간 = 10,000원
고행10 메피스토 1회당 = 7,000원
---------------------------------------
`;

const container = document.getElementById("price-list");

const sections = priceText
  .split(/\n\s*-{5,}\s*\n/)
  .map(section => section.trim())
  .filter(section => section.length > 0);
   
sections.forEach(section => {
  const lines = section
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0);

  if (lines.length === 0) return;

  const box = document.createElement("div");
  box.className = "box";

  lines.forEach((line, index) => {
    const div = document.createElement("div");

    if (index === 0) {
      div.className = "title";
      div.textContent = line;
    } else if (line.startsWith("(") && line.endsWith(")")) {
      div.className = "line note";
      div.textContent = line;
    } else {
      div.className = "line";
      div.textContent = line;
    }

    box.appendChild(div);
  });

  container.appendChild(box);
});
</script>

</body>
</html>
