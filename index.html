<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시세표 시즌13</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.3;
      font-size: 18px;
    }

    h1 {
      text-align: center;
      color: #ff4444;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .box {
      background: #1b1b1b;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .title {
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .line {
      margin: 0;
      padding: 0;
    }

    a {
      color: #4da6ff;
      text-decoration: none;
      word-break: break-all;
    }

    .center {
      text-align: center;
    }

    .note {
      color: #bbb;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h1>▼▼▼▼▼ 시세표 시즌13 ▼▼▼▼▼</h1>

<div class="box center">
  <div>
    <a href="https://open.kakao.com/o/sIJnJfui">
      https://open.kakao.com/o/sIJnJfui
    </a>
  </div>
  <div>1:1 채팅방 문의주시면 바로 도움드리겠습니다</div>
</div>

<div id="price-list"></div>

<div class="box center">
  <div class="title">디오이 채팅방</div>
  <div>
    <a href="https://open.kakao.com/o/gtu45m1g">
      https://open.kakao.com/o/gtu45m1g
    </a>
  </div>
</div>

<div class="box center">
  <div class="title">아이템 거래 사이트</div>
  <div>
    <a href="https://itembus.com/">
      https://itembus.com/
    </a>
  </div>
</div>

<script>
const priceText = `
----------------------------------------
▶신화꾸러미
1회 = 4,000원
5회 = 18,000원
10회 = 32,000원
20회 = 60,000원
(10분이내 출발 스피드)
(신화랜덤1개+벼락불1개)
---------------------------------------
▶잊힌영혼
(바닥거래)
1000개 = 8,000원
3000개 = 20,000원
5000개 = 35,000원
---------------------------------------
▶보물의틈새
1회 = 3,000원
5회 = 10,000원
10회 = 15,000원
20회 = 28,000원
(옵두사이트,니스아이언,분광경 획득)
---------------------------------------
▶금화
300억 = 5,000원
500억 = 9,000원
900억 = 13,000원
---------------------------------------
▶상급 소굴열쇠
200개 = 5,000원
500개 = 10,000원
1000개 = 14,000원
2000개 = 27,000원
---------------------------------------
▶하급 소굴열쇠
200개 = 5,000원
500개 = 10,000원
1000개 = 14,000원
2000개 = 27,000원
--------------------------------------
▶껍데기
100개 = 10,000원
200개 = 19,000원
300개 = 26,000원
500개 = 38,000원
1000개 = 60,000원
--------------------------------------
▶웅장한보석
5개 = 5,000원 (섞어서가능)
10개 = 8,000원 (섞어서가능)
20개 = 15,000원 (섞어서가능)
50개 = 28,000원 (섞어서가능)
100개 = 45,000원 (섞어서가능)
---------------------------------------
▶️온전한 호라드림 보석
1개 = 7,000원
5개 = 22,000원
10개= 40,000원
20개= 75,000원
---------------------------------------
▶룬셋(샤코,수의,별반,영벌,한아비,셀리그)
1셋 = 5,000원
3셋 = 9,000원
5셋 = 13,000원
---------------------------------------
1-70레벨+고행12 = 10,000원
1-70레벨+100레벨 = 30,000원
---------------------------------------
`;

const container = document.getElementById("price-list");

const sections = priceText
  .split(/\n\s*-{5,}\s*\n/)
  .map(section => section.trim())
  .filter(section => section.length > 0);
   
sections.forEach(section => {
  const lines = section
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0);

  if (lines.length === 0) return;

  const box = document.createElement("div");
  box.className = "box";

  lines.forEach((line, index) => {
    const div = document.createElement("div");

    if (index === 0) {
      div.className = "title";
      div.textContent = line;
    } else if (line.startsWith("(") && line.endsWith(")")) {
      div.className = "line note";
      div.textContent = line;
    } else {
      div.className = "line";
      div.textContent = line;
    }

    box.appendChild(div);
  });

  container.appendChild(box);
});
</script>

</body>
</html>
