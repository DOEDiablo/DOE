<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시세표 시즌14</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.3;
      font-size: 18px;
    }

    h1 {
      text-align: center;
      color: #ff4444;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .box {
      background: #1b1b1b;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .title {
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .line {
      margin: 0;
      padding: 0;
    }

    a {
      color: #4da6ff;
      text-decoration: none;
      word-break: break-all;
    }

    .center {
      text-align: center;
    }

    .note {
      color: #bbb;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h1>▼▼▼▼▼ 시세표 시즌14 ▼▼▼▼▼</h1>

<div class="box center">
  <div>
    <a href="https://open.kakao.com/o/sIJnJfui">
      https://open.kakao.com/o/saXUOdwi
    </a>
  </div>
  <div>1:1 채팅방 문의주시면 바로 도움드리겠습니다</div>
</div>

<div id="price-list"></div>

<div class="box center">
  <div class="title">디오이 채팅방</div>
  <div>
    <a href="https://open.kakao.com/o/gtu45m1g">
      https://open.kakao.com/o/gtu45m1g
    </a>
  </div>
</div>

<div class="box center">
  <div class="title">아이템 거래 사이트</div>
  <div>
    <a href="https://itembus.com/">
      https://itembus.com/
    </a>
  </div>
</div>

<script>
const priceText = `


---------------------------------------
▶금화
30억 = 5,000원
50억 = 9,000원
100억 = 13,000원
500억 = 64,000원
---------------------------------------
▶상급/하급 소굴열쇠
10개 = 3,000원
50개 = 14,000원
100개 = 25,000원
---------------------------------------
▶고급 소굴열쇠
10개 = 6,500원
50개 = 21,500원
---------------------------------------
▶웅장한보석
1개 = 4,000원
5개 = 16,000원
---------------------------------------
▶온전한 호라드림 보석
1개 = 14,000원
4개 = 55,000원
---------------------------------------
▶선지자 십자가 (메피스토비축고)
1개 = 2,500원
10개 = 19,000원
30개 = 45,000원
---------------------------------------
▶룬셋
수수께끼 룬세트 1셋 12,000원
통찰 룬세트 1셋 10,000원
영혼 룬세트 1셋 10,000원
---------------------------------------
▶릴리트 고행8단&메피스토 고행12단
메피스토5회 = 15,000원
메피스토10회 = 28,000원
---------------------------------------
1-70레벨+고행12 = 8,000원
1-70레벨+정복자100 = 25,000원
나락100단 1시간 = 16,000원
---------------------------------------
`;

const container = document.getElementById("price-list");

const sections = priceText
  .split(/\n\s*-{5,}\s*\n/)
  .map(section => section.trim())
  .filter(section => section.length > 0);
   
sections.forEach(section => {
  const lines = section
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0);

  if (lines.length === 0) return;

  const box = document.createElement("div");
  box.className = "box";

  lines.forEach((line, index) => {
    const div = document.createElement("div");

    if (index === 0) {
      div.className = "title";
      div.textContent = line;
    } else if (line.startsWith("(") && line.endsWith(")")) {
      div.className = "line note";
      div.textContent = line;
    } else {
      div.className = "line";
      div.textContent = line;
    }

    box.appendChild(div);
  });

  container.appendChild(box);
});
</script>

</body>
</html>
