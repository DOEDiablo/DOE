<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시세표 시즌13</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.3;
      font-size: 18px;
    }

    h1 {
      text-align: center;
      color: #ff4444;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .box {
      background: #1b1b1b;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .title {
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .line {
      margin: 0;
      padding: 0;
    }

    a {
      color: #4da6ff;
      text-decoration: none;
      word-break: break-all;
    }

    .center {
      text-align: center;
    }

    .note {
      color: #bbb;
      font-size: 15px;
    }
  </style>
</head>

<body>

<h1>▼▼▼▼▼ 시세표 시즌13 ▼▼▼▼▼</h1>

<div class="box center">
  <div>
    <a href="https://open.kakao.com/o/sIJnJfui">
      https://open.kakao.com/o/sIJnJfui
    </a>
  </div>
  <div>1:1 채팅방 문의주시면 바로 도움드리겠습니다</div>
</div>

<div id="price-list"></div>

<div class="box center">
  <div class="title">디오이 채팅방</div>
  <div>
    <a href="https://open.kakao.com/o/gtu45m1g">
      https://open.kakao.com/o/gtu45m1g
    </a>
  </div>
</div>

<div class="box center">
  <div class="title">아이템 거래 사이트</div>
  <div>
    <a href="https://itembus.com/">
      https://itembus.com/
    </a>
  </div>
</div>

<script>
const priceText = `

----------------------------------------
▶전직업  / 고유 장비 판매중
▶필요한 장비옵션 문의주세요
----------------------------------------
▶각종 부적세트or문장 문의주세요
----------------------------------------
▶신화병기 공물버스
5회 = 8,000원
10회 = 14,000원
20회 = 26,000원
(10분이내 출발 스피드)
판당 신화템 1~4개 랜덤 드랍
---------------------------------------
▶잊힌영혼
(바닥거래)
1000개 = 5,000원
3000개 = 11,000원
5000개 = 17,000원
---------------------------------------
▶옵두버스
1만개 = 5,000원
3만개 = 12,000원
5만개 = 18,000원
10만개 = 33,000원
---------------------------------------
▶금화
200억 = 4,000원
500억 = 8,000원
900억 = 9,000원
---------------------------------------
▶상급 소굴열쇠
100개 = 6,000원
200개 = 11,000원
500개 = 24,000원
---------------------------------------
▶하급 소굴열쇠
100개 = 6,000원
200개 = 9,000원
500개 = 16,000원
1000개 = 30,000원
---------------------------------------
▶껍데기
100개 = 15,000원
200개 = 27,000원
300개 = 40,000원
--------------------------------------
▶웅장한보석
10개 = 4,000원
20개 = 7,000원
50개 = 12,000원
100개 = 18,000원
---------------------------------------
▶온전한 호라드림 보석
1개 = 4,000원
5개 = 14,000원
10개= 24,000원
20개 = 46,000원
30개 = 70,000원
---------------------------------------
▶선지자 십자가 (메피스토비축고)
10개 = 6,000원
20개 = 11,000원
30개 = 15,000원
40개 = 20,000원
---------------------------------------
▶룬셋(샤코,수의,별반,영벌,한아비,셀리그)
1셋 = 3,000원
3셋 = 5,000원
5셋 = 9,000원
10셋 = 15,000원
---------------------------------------
▶쿨레 조율된 분광경
100개 = 5,000원
300개 = 12,000원  
500개 = 20,000원
1000개 = 38,000원
---------------------------------------
▶엔트로피/공격적인/숙련자/다채로운 등등
300개 = 6,000원
1000개 = 12,000원
2000개 = 20,000원
5000개 = 33,000원
---------------------------------------
▶타락한뿌리
500개 = 20,000원
1000개 = 38,000원
---------------------------------------
▶릴리트 고행8단&메피스토 고행12단
릴리트1회 = 5,000원
메피스토1회 = 5,000원
메피스토5회 = 14,000원
메피스토10회 = 25,000원
메피스토20회 = 45,000원
---------------------------------------
▶레벨업
1-70레벨+고행12 = 10,000원
1-70레벨+100레벨 = 30,000원
---------------------------------------
`;

const container = document.getElementById("price-list");

const sections = priceText
  .split(/\n\s*-{5,}\s*\n/)
  .map(section => section.trim())
  .filter(section => section.length > 0);
   
sections.forEach(section => {
  const lines = section
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0);

  if (lines.length === 0) return;

  const box = document.createElement("div");
  box.className = "box";

  lines.forEach((line, index) => {
    const div = document.createElement("div");

    if (index === 0) {
      div.className = "title";
      div.textContent = line;
    } else if (line.startsWith("(") && line.endsWith(")")) {
      div.className = "line note";
      div.textContent = line;
    } else {
      div.className = "line";
      div.textContent = line;
    }

    box.appendChild(div);
  });

  container.appendChild(box);
});
</script>

</body>
</html>
